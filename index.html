    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'Inter', 'sans-serif'],
              jakarta: ['Plus Jakarta Sans', 'sans-serif'],
              geist: ['Geist', 'sans-serif'],
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 3s ease-in-out infinite',
              'glow': 'glow 4s ease-in-out infinite',
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'slide-down': 'slideDown 0.6s ease-out forwards',
            }
          }
        }
      }
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: 'Manrope', sans-serif; }
      
      /* Firefox Scrollbar Support */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(16, 185, 129, 0.2) transparent;
      }

      /* Nexus Theme Animations */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes slideDown {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes glow {
        0%, 100% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
        50% { box-shadow: 0 0 40px rgba(16, 185, 129, 0.6); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      .glass-effect {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .dark .glass-effect {
        background: rgba(20, 20, 30, 0.6);
        border: 1px solid rgba(255,255,255,0.05);
      }
      
      .gradient-text {
        background: linear-gradient(to right, #111827, #4b5563);
        -webkit-background-clip: text;
        color: transparent;
      }
      .dark .gradient-text {
        background: linear-gradient(to right, #f3f4f6, #9ca3af);
        -webkit-background-clip: text;
        color: transparent;
      }

      /* HIDE NUMBER SPINNERS GLOBALLY */
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type=number] {
        -moz-appearance: textfield;
      }

      /* Scrollbar Utility */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Custom Scrollbar for other elements */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.2); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(16, 185, 129, 0.4); }

      /* Print Styles */
      @media print {
        @page { size: A4; margin: 0; }
        body { background: white !important; color: black !important; -webkit-print-color-adjust: exact; }
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        .glass-effect { background: none !important; box-shadow: none !important; backdrop-filter: none !important; }
        aside { display: none !important; }
        /* Ensure inputs print their values */
        input, textarea, select { border: none !important; background: transparent !important; resize: none; overflow: visible; }
        
        /* Forces page break only during browser print, ignored by html2pdf default flow */
        .print-break-page { page-break-after: always; break-after: page; }
      }
    </style>
    <script>
       // Prevent FOUC and enforce light mode default
       try {
        const storedTheme = localStorage.getItem('theme');
        // Only apply dark mode if explicitly stored as 'dark'. Default is light.
        if (storedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>

    <script>
      // Service Worker Registration with safe error handling for development environments
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Register using a standard relative path to avoid "not a valid URL" constructor errors
          navigator.serviceWorker.register('./sw.js').catch(err => {
            // Log as info since this is often environment-specific and non-critical during build
            console.info('Service Worker registration skipped or failed in this preview environment.');
          });
        });
      }
    </script>
