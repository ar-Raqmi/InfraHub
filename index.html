  <style>
    body {
      font-family: 'Manrope', sans-serif;
    }

    /* Splash Screen Styles (Shadow-free) */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out, visibility 0.5s;
    }

    .splash-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 2rem;
    }

    .progress-container {
      width: 240px;
      height: 6px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1rem;
      position: relative;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #3b82f6);
      border-radius: 999px;
      transition: width 0.3s ease-out;
    }

    .status-text {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #64748b;
      margin-bottom: 0.5rem;
    }

    #network-status {
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
    }

    .hidden-splash {
      opacity: 0;
      visibility: hidden;
    }

    /* Firefox Scrollbar Support */
    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(16, 185, 129, 0.2) transparent;
    }

    /* Optimized Animations (Non-continuous) */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .glass-effect {
      background: rgba(255, 255, 255, 1) !important;
      border: 1px solid rgba(0, 0, 0, 0.1) !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    .gradient-text {
      background: linear-gradient(to right, #111827, #4b5563);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    [class*="shadow-"] {
      border: 1px solid #e2e8f0 !important;
    }

    /* HIDE NUMBER SPINNERS GLOBALLY */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      appearance: none;
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      appearance: textfield;
      -moz-appearance: textfield;
    }

    /* Scrollbar Utility */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Custom Scrollbar for other elements */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.2);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(16, 185, 129, 0.4);
    }

    /* Print Styles */
    @media print {
      @page {
        size: A4;
        margin: 0;
      }

      body {
        background: white !important;
        color: black !important;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .no-print {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }

      .glass-effect {
        background: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
      }

      aside {
        display: none !important;
      }

      /* Ensure inputs print their values */
      input,
      textarea,
      select {
        border: none !important;
        background: transparent !important;
        resize: none;
        overflow: visible;
      }

      /* Forces page break only during browser print, ignored by html2pdf default flow */
      .print-break-page {
        page-break-after: always;
        break-after: page;
      }
    }
  </style>
  <script type="importmap">
{
 "imports": {

}

<body class="h-full bg-slate-50 text-slate-900 antialiased overflow-x-hidden">
  <!-- Splash Screen (removed by React on mount) -->
  <div id="splash-screen">
    <img src="https://cdn-icons-png.flaticon.com/512/2827/2827469.png" alt="InfraHub" class="splash-logo" />
    <div class="status-text" id="status-message">Initializing InfraHub...</div>
    <div class="progress-container">
      <div id="progress-bar"></div>
    </div>
    <div id="network-status"></div>
    <button id="refresh-btn" onclick="window.location.reload()"
      style="display:none; margin-top: 1.5rem; padding: 0.5rem 1rem; background: #10b981; color: white; border: none; border-radius: 0.5rem; font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase;">Muat
      Semula Halaman</button>
  </div>

  <div id="root" class="h-full"></div>

  <!-- Optimization Scripts -->
  <script>
    (function () {
      const bar = document.getElementById('progress-bar');
      const msg = document.getElementById('status-message');
      const net = document.getElementById('network-status');
      const btn = document.getElementById('refresh-btn');
      let progress = 0;
      let isComplete = false;

      // Expose a way for React to signal completion
      window.__APP_READY__ = function () {
        isComplete = true;
        progress = 100;
        bar.style.width = '100%';
        msg.innerText = 'App Ready!';
        setTimeout(() => {
          const splash = document.getElementById('splash-screen');
          if (splash) splash.style.opacity = '0';
          setTimeout(() => splash && splash.remove(), 500);
        }, 200);
      };

      // Network Awareness
      if (navigator.connection) {
        const type = navigator.connection.effectiveType;
        if (type === '2g' || type === '3g') {
          net.innerText = 'Slow connection detected (' + type.toUpperCase() + ')';
          msg.innerText = 'Loading assets (This may take a while)...';
        }
      }

      function animate() {
        if (isComplete) return;

        if (progress < 92) {
          // Slower as it gets higher
          const increment = (95 - progress) / 50;
          progress += increment;
          bar.style.width = progress + '%';

          if (progress > 30 && progress < 60) msg.innerText = 'Downloading modules...';
          if (progress >= 60 && progress < 85) msg.innerText = 'Preparing workspace...';
          if (progress >= 85) msg.innerText = 'Finalizing...';

          requestAnimationFrame(animate);
        }
      }

      requestAnimationFrame(animate);

      // Fallback for extreme delays
      setTimeout(() => {
        if (!isComplete && document.getElementById('splash-screen')) {
          msg.innerText = 'Connection seems slow...';
          btn.style.display = 'block';
        }
      }, 20000);
    })();
  </script>

  <!-- Essential Libraries -->
  <script src="/tailwind.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'Inter', 'sans-serif'],
            jakarta: ['Plus Jakarta Sans', 'sans-serif'],
            geist: ['Geist', 'sans-serif'],
          },
          boxShadow: {
            DEFAULT: 'none',
            sm: 'none',
            md: 'none',
            lg: 'none',
            xl: 'none',
            '2xl': 'none',
            'inner': 'none',
          },
          backdropBlur: {
            DEFAULT: '0',
            sm: '0',
            md: '0',
            lg: '0',
            xl: '0',
            '2xl': '0',
            '3xl': '0',
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out forwards',
            'slide-up': 'slideUp 0.3s ease-out forwards',
            'pulse-slow': 'none',
          }
        }
      }
    }
  </script>
  <script type="module" src="./index.tsx"></script>
  <script>
    // Unregister any active service worker to prevent upload request body corruption and force a single reload to apply
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        if (registrations && registrations.length > 0) {
          Promise.all(registrations.map(r => r.unregister())).then(() => {
            console.info('Service Worker unregistered. Reloading page to apply changes...');
            window.location.reload();
          });
        }
      }).catch(err => {
        console.error('Failed to unregister service worker:', err);
      });
    }
  </script>
</body>
